name: Automated Issue Triage

on:
  issues:
    types: [opened]

permissions:
  issues: write

jobs:
  triage:
    runs-on: ubuntu-latest

    steps:
      - name: Welcome Comment to Author
        uses: peter-evans/create-or-update-comment@v4
        with:
          issue-number: ${{ github.event.issue.number }}
          body: |
            Chào mừng bạn **@${{ github.event.issue.user.login }}** đã gửi phản hồi cho dự án!
            Đội ngũ Maintainer đã tiếp nhận và sẽ sàng lọc Issue trong thời gian sớm nhất theo chuẩn Async-first.
            Vui lòng kiểm tra lại xem bạn đã cung cấp đủ Log, OS, và Phiên bản theo mẫu yêu cầu chưa nhé.

      - name: Assign Initial Triage Label
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea
        with:
          script: |
            await github.rest.issues.addLabels({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: ['status: needs-triage']
            })
